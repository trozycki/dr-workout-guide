<title>DR Workout Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body { height: 100%; background: #0a0a0a; color: #fff; font-family: 'Barlow', sans-serif; font-size: 16px; line-height: 1.5; overflow-x: hidden; }
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  .h { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; }
  .muted { color: rgba(255,255,255,0.4); }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 6px; }

  .progress-bar { height: 3px; background: #1a1a1a; flex-shrink: 0; }
  .progress-fill { height: 3px; background: var(--accent, #f97316); transition: width 0.3s ease; }

  .screen { min-height: 100vh; display: flex; flex-direction: column; }

  .phase-header { padding: 44px 24px 24px; }
  .phase-header-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .phase-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 42px; line-height: 1; color: #fff; }
  .phase-grid { padding: 0 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .phase-card { background: #141414; border-radius: 20px; padding: 22px 18px; display: flex; flex-direction: column; justify-content: space-between; min-height: 150px; position: relative; overflow: hidden; cursor: pointer; border: 1px solid transparent; transition: border-color 0.2s; }
  .phase-card:active { transform: scale(0.98); }
  .phase-card.full-width { grid-column: 1 / -1; min-height: 110px; }
  .phase-card-bar { position: absolute; top: 0; left: 0; width: 3px; height: 100%; border-radius: 20px 0 0 20px; }
  .phase-card-label { font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.4); }
  .phase-card-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 26px; color: #fff; line-height: 1.1; }
  .phase-card-weeks { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 4px; }
  .phase-footer { text-align: center; font-size: 11px; color: rgba(255,255,255,0.3); padding: 24px; }

  .log-btn { background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.55); border-radius: 12px; padding: 10px 14px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Barlow', sans-serif; }
  .log-btn:active { transform: scale(0.97); }

  .day-header { padding: 40px 24px 24px; }
  .back-btn { background: none; border: none; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0; margin-bottom: 20px; display: block; font-family: 'Barlow', sans-serif; }
  .day-list { padding: 0 24px 40px; display: flex; flex-direction: column; gap: 10px; }
  .day-card { background: #141414; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 20px; display: flex; align-items: center; gap: 16px; cursor: pointer; text-align: left; }
  .day-card:active { transform: scale(0.98); }
  .day-icon { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 26px; width: 40px; text-align: center; flex-shrink: 0; }
  .day-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 19px; color: #fff; }
  .day-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }
  .day-arrow { color: rgba(255,255,255,0.2); font-size: 20px; margin-left: auto; }
  .day-date { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.35); margin-top: 3px; }

  .workout-header { padding: 14px 24px 10px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .workout-counter { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.4); }
  .workout-counter span { color: #fff; }
  .card-wrap { flex: 1; padding: 0 16px 12px; display: flex; flex-direction: column; overflow-y: auto; }
  .ex-card { background: #141414; border-radius: 20px; padding: 20px; flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; transition: border-color 0.3s; }
  .badge-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .badge-accent { background: rgba(249,115,22,0.15); color: #f97316; }
  .badge-neutral { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.4); }
  .ex-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 30px; line-height: 1.05; margin-bottom: 8px; color: #fff; }
  .ex-tip { font-size: 13px; color: rgba(255,255,255,0.45); line-height: 1.55; margin-bottom: 16px; font-style: italic; }
  .stats-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .stat-box { background: #1e1e1e; border-radius: 14px; padding: 12px 8px; text-align: center; flex: 1; }
  .stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 22px; }
  .stat-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-top: 3px; }

  .weight-section { margin-bottom: 18px; }
  .weight-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .weight-label { font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.4); }
  .last-weight { font-size: 11px; color: rgba(255,255,255,0.28); }
  .weight-input-row { display: flex; align-items: center; gap: 10px; }
  .weight-input { flex: 1; background: #1e1e1e; border-radius: 14px; padding: 14px 16px; color: #fff; font-size: 24px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; outline: none; width: 100%; border: 1.5px solid rgba(255,255,255,0.1); transition: border-color 0.2s; }
  .weight-input:focus { border-color: rgba(249,115,22,0.5); }
  .weight-unit { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px; color: rgba(255,255,255,0.28); white-space: nowrap; }

  .sets-section { }
  .sets-label { font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 10px; }
  .sets-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .set-circle { width: 54px; height: 54px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.14); background: transparent; color: rgba(255,255,255,0.28); font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 20px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
  .set-circle.done { background: #f97316; border-color: #f97316; color: #000; transform: scale(1.1); }
  .all-done-msg { font-size: 13px; font-weight: 600; margin-top: 14px; display: none; }

  .timer-overlay { position: absolute; inset: 0; background: rgba(10,10,10,0.97); border-radius: 20px; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
  .timer-overlay.visible { display: flex; }
  .timer-label { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 20px; }
  .timer-ring { position: relative; width: 140px; height: 140px; margin-bottom: 14px; }
  .timer-ring svg { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }
  .timer-number { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 52px; }
  .timer-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 28px; }
  .skip-btn { background: #1e1e1e; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.55); border-radius: 40px; padding: 12px 28px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Barlow', sans-serif; }
  .skip-btn:active { transform: scale(0.97); }

  .nav-row { padding: 0 16px 32px; display: flex; gap: 10px; flex-shrink: 0; }
  .nav-btn { flex: 1; padding: 18px; border: none; border-radius: 16px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.05em; cursor: pointer; transition: all 0.15s; }
  .nav-btn:active { transform: scale(0.97); }
  .nav-btn-prev { background: #1a1a1a; color: #fff; }
  .nav-btn-prev:disabled { color: rgba(255,255,255,0.18); cursor: default; }
  .nav-btn-prev:disabled:active { transform: none; }
  .nav-btn-next { background: #1a1a1a; color: #fff; }
  .nav-btn-next.ready { background: #f97316; color: #000; }

  .done-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; }
  .done-check { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 72px; line-height: 1; margin-bottom: 16px; }
  .done-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 44px; line-height: 1; margin-bottom: 8px; }
  .done-sub { font-size: 14px; color: rgba(255,255,255,0.4); margin-bottom: 4px; }
  .done-date { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 28px; }
  .session-summary { background: #141414; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; width: 100%; margin-bottom: 20px; text-align: left; }

// ─── HELPERS ─────────────────────────────────────────────────────────────────

function saveHistory() {
  try { localStorage.setItem('wg_history', JSON.stringify(state.history)); } catch(e) {}
}

function isVacation() { return state.phase === 5; }
function getPhase() { return PHASES.find(p => p.id === state.phase); }
function getDayList() { return isVacation() ? VACATION_DAYS : DAYS; }
function getDay()   { return getDayList().find(d => d.id === state.dayId); }
function getExercises() { return getDay()?.exercises || []; }
function getExercise()  { return getExercises()[state.exIdx]; }

function getParams() {
  const ex = getExercise();
  if (!ex) return null;
  if (isVacation()) {
    return {
      sets: ex.customSets || 3,
      reps: ex.customReps || '—',
      restSec: ex.customRestSec || 40,
      rest: ex.customRestSec ? `${ex.customRestSec}s` : '40s',
    };
  }
  if (!state.phase) return null;
  return PARAMS[state.phase]?.[ex.type] || null;
}

function getCurrentSets() {
  const p = getParams();
  const sets = p?.sets || 3;
  return state.setsMap[state.exIdx] || Array(sets).fill(false);
}

function isAllDone() {
  return getCurrentSets().every(Boolean);
}

function getLastWeight(exName) {
  for (const s of state.history) {
    const m = s.exercises?.find(e => e.name === exName);
    if (m?.weight) return m.weight;
  }
  return null;
}

function todayStr() {
  return new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function stopTimer() {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
  state.timerSec = null; state.timerMax = null;
}

const CIRC = 2 * Math.PI * 52;

// ─── RENDER ──────────────────────────────────────────────────────────────────

function render() {
  const app = document.getElementById('app');
  stopTimer();

  switch (state.screen) {
    case 'phase':   app.innerHTML = renderPhase();   break;
    case 'day':     app.innerHTML = renderDay();     break;
    case 'workout': app.innerHTML = renderWorkout(); startWorkoutListeners(); break;
    case 'done':    app.innerHTML = renderDone();    break;
    case 'history': app.innerHTML = renderHistory(); break;
  }
}

function renderPhase() {

function renderDay() {
  const ph = getPhase();

  <div class="screen">
    <div class="day-header">
      <button class="back-btn" style="color:${ph.accent}" onclick="goPhase()">← Back</button>

  const rest = p?.rest || '—';
  const progress = state.exIdx / exercises.length;
  const currentSets = getCurrentSets();
  const allDone = currentSets.every(Boolean);
  const lastW = getLastWeight(ex.name);
  const curW = state.weights[state.exIdx] || '';

  return `
  <div class="screen" id="workout-screen">
    <div class="progress-bar"><div class="progress-fill" style="width:${progress*100}%;background:${ph.accent}"></div></div>
    <div class="workout-header">
      <button class="back-btn" style="color:rgba(255,255,255,0.35);margin-bottom:0" onclick="goDay()">← Back</button>
      <div class="workout-counter"><span>${state.exIdx+1}</span> / ${exercises.length}</div>
    </div>
    <div class="card-wrap">
      <div class="ex-card" id="ex-card" style="border:1px solid ${allDone ? ph.accent+'55' : 'rgba(255,255,255,0.08)'}">
        <div class="badge-row">
          <span class="badge" style="background:${ph.accent}22;color:${ph.accent}">${ph.name}</span>
          <span class="badge badge-neutral">${TYPE_LABEL[ex.type] || ex.type}</span>
        </div>
        <div class="ex-name h">${ex.name}</div>
        <div class="ex-tip">${ex.tip}</div>
        <div class="stats-row">
          ${[['SETS',sets],['REPS',reps],['REST',rest]].map(([l,v]) => `
            <div class="stat-box">
              <div class="stat-val h" style="color:${ph.accent}">${v}</div>
              <div class="stat-label">${l}</div>
            </div>`).join('')}
        </div>
        <div class="weight-section">
          <div class="weight-header">
            <span class="weight-label">Weight Used ${isVacation() ? '(optional)' : ''}</span>
            ${lastW ? `<span class="last-weight">Last: <span style="color:${ph.accent}">${lastW} lbs</span></span>` : ''}
          </div>
          <div class="weight-input-row">
            <input class="weight-input" id="weight-input" type="number" inputmode="decimal"
              value="${curW}" placeholder="${lastW || '0'}"
              style="border-color:${curW ? ph.accent+'60' : 'rgba(255,255,255,0.1)'}"
              oninput="onWeightInput(this.value)">
            <span class="weight-unit">LBS</span>
          </div>
        </div>
        <div class="sets-section">
          <div class="sets-label">Tap each set when complete</div>
          <div class="sets-row">
            ${currentSets.map((done, i) => `
              <button class="set-circle${done?' done':''}" id="set-${i}"
                style="${done?`background:${ph.accent};border-color:${ph.accent}`:''}"
                onclick="tapSet(${i})">${done ? '✓' : i+1}</button>
            `).join('')}
          </div>
          <div class="all-done-msg" id="all-done-msg" style="color:${ph.accent};${allDone?'display:block':''}">
            ✓ All sets done — swipe forward or tap Next
          </div>
        </div>
        <div class="timer-overlay" id="timer-overlay">
          <div class="timer-label">Rest</div>
          <div class="timer-ring">
            <svg width="140" height="140">
              <circle cx="70" cy="70" r="52" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="6"/>
              <circle id="timer-arc" cx="70" cy="70" r="52" fill="none" stroke="${ph.accent}" stroke-width="6"
                stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"
                stroke-linecap="round" transform="rotate(-90 70 70)" style="transition:stroke-dashoffset 0.95s linear"/>
            </svg>
            <div class="timer-number h" id="timer-num" style="color:${ph.accent}">—</div>
          </div>
          <div class="timer-sub">seconds remaining</div>
          <button class="skip-btn" onclick="skipRest()">Skip Rest</button>
        </div>
      </div>
    </div>
    <div class="nav-row">
      <button class="nav-btn nav-btn-prev" id="btn-prev" onclick="goPrevEx()" ${state.exIdx===0?'disabled':''}>‹ Prev</button>
      <button class="nav-btn nav-btn-next${allDone?' ready':''}" id="btn-next"
        style="${allDone?`background:${ph.accent};color:#000`:''}" onclick="goNextEx()">
        ${state.exIdx===exercises.length-1 ? 'Finish' : 'Next ›'}
      </button>
    </div>
  </div>`;
}

function renderDone() {
  const ph = getPhase();
  const day = getDay();
  const last = state.history[0];
  return `
  <div class="done-screen">
    <div class="done-check h" style="color:${ph.accent}">✓</div>
    <div class="done-title h">SESSION<br>COMPLETE</div>
    <div class="done-sub">${day?.name} · ${ph.name}</div>
    <div class="done-date">${todayStr()}</div>
    ${last ? `
    <div class="session-summary">
      <div class="summary-title">Session Summary</div>
      ${last.exercises.map(ex => `
        <div class="summary-row">
          <span class="summary-ex">${ex.name}</span>
          <div class="summary-vals">
            ${ex.weight ? `<span class="summary-weight h" style="color:${ph.accent}">${ex.weight} lbs</span>` : '<span class="summary-reps">—</span>'}
            <span class="summary-reps">${ex.sets}×${ex.reps}</span>
          </div>
        </div>`).join('')}
    </div>` : ''}
    <button class="done-btn done-btn-primary" onclick="anotherSession()">Another Session</button>
    <button class="done-btn done-btn-secondary" onclick="goPhase()">Change Phase</button>
    <button class="done-btn done-btn-ghost" onclick="goHistory()">View Full Log</button>
  </div>`;
}

function renderHistory() {
  return `
  <div class="screen">
    <div class="history-header">
      <div>
        <button class="back-btn" style="color:rgba(255,255,255,0.4);margin-bottom:10px" onclick="goPhase()">← Back</button>
        <div class="history-title h">SESSION LOG</div>
        <div class="history-count">${state.history.length} session${state.history.length !== 1 ? 's' : ''} saved</div>
      </div>
      ${state.history.length > 0 ? `<button class="clear-btn" onclick="clearHistory()">Clear All</button>` : ''}
    </div>
    <div class="history-list">
      ${state.history.length === 0
        ? '<div class="history-empty">No sessions yet. Complete a workout to see your log here.</div>'
        : state.history.map(s => {
            const a = PHASES.find(p => p.id === s.phase)?.accent || '#f97316';
            return `
            <div class="history-item">
              <div class="history-item-header">
                <div>
                  <span class="history-item-name">${s.dayName || '—'}</span>
                  <span class="history-item-phase">${s.phaseName || ''}</span>
                </div>
                <span class="history-item-date">${s.date}</span>
              </div>
              ${(s.exercises||[]).map(ex => `
                <div class="history-ex-row">
                  <span class="history-ex-name">${ex.name}</span>
                  <div class="history-ex-vals">
                    ${ex.weight ? `<span class="history-ex-weight h" style="color:${a}">${ex.weight} lbs</span>` : '<span class="history-ex-reps">—</span>'}
                    <span class="history-ex-reps">${ex.sets}×${ex.reps}</span>
                  </div>
                </div>`).join('')}
            </div>`;
          }).join('')}
    </div>
  </div>`;
}

// ─── WORKOUT INTERACTIONS ─────────────────────────────────────────────────────

function startWorkoutListeners() {
  const ws = document.getElementById('workout-screen');
  if (!ws) return;
  let tx = null;
  ws.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  ws.addEventListener('touchend', e => {
    if (tx === null) return;
    const dx = tx - e.changedTouches[0].clientX;
    tx = null;
    if (Math.abs(dx) > 55) { dx > 0 ? goNextEx() : goPrevEx(); }
  }, { passive: true });
}

function onWeightInput(val) {
  state.weights[state.exIdx] = val;
  const input = document.getElementById('weight-input');
  const ph = getPhase();
  if (input) input.style.borderColor = val ? ph.accent + '60' : 'rgba(255,255,255,0.1)';
}

function tapSet(i) {
  const p = getParams();
  const sets = p?.sets || 3;
  const cur = state.setsMap[state.exIdx] || Array(sets).fill(false);
  const next = [...cur]; next[i] = !next[i];
  state.setsMap[state.exIdx] = next;

  const ph = getPhase();
  const btn = document.getElementById(`set-${i}`);
  if (btn) {
    btn.classList.toggle('done', next[i]);
    btn.style.background = next[i] ? ph.accent : 'transparent';
    btn.style.borderColor = next[i] ? ph.accent : 'rgba(255,255,255,0.14)';
    btn.style.color = next[i] ? '#000' : 'rgba(255,255,255,0.28)';
    btn.style.transform = next[i] ? 'scale(1.1)' : 'scale(1)';
    btn.textContent = next[i] ? '✓' : i + 1;
  }

  const allDone = next.every(Boolean);
  const msg = document.getElementById('all-done-msg');
  if (msg) msg.style.display = allDone ? 'block' : 'none';

  const card = document.getElementById('ex-card');
  if (card) card.style.borderColor = allDone ? ph.accent + '55' : 'rgba(255,255,255,0.08)';

  const nextBtn = document.getElementById('btn-next');
  if (nextBtn) {
    nextBtn.classList.toggle('ready', allDone);
    nextBtn.style.background = allDone ? ph.accent : '#1a1a1a';
    nextBtn.style.color = allDone ? '#000' : '#fff';
  }

  if (next[i] && p?.restSec > 0) startTimer(p.restSec);
  else stopTimerUI();
}

function startTimer(seconds) {
  stopTimer();
  state.timerSec = seconds; state.timerMax = seconds;
  const overlay = document.getElementById('timer-overlay');
  if (overlay) overlay.classList.add('visible');
  updateTimerUI();
  state.timerInterval = setInterval(() => {
    state.timerSec--;
    if (state.timerSec <= 0) { stopTimerUI(); stopTimer(); }
    else updateTimerUI();
  }, 1000);
}

function updateTimerUI() {
  const num = document.getElementById('timer-num');
  const arc = document.getElementById('timer-arc');
  if (num) num.textContent = state.timerSec;
  if (arc && state.timerMax) {
    const progress = state.timerSec / state.timerMax;
    arc.style.strokeDashoffset = CIRC - CIRC * progress;
  }
}

function stopTimerUI() {
  const overlay = document.getElementById('timer-overlay');
  if (overlay) overlay.classList.remove('visible');
  stopTimer();
}

function skipRest() { stopTimerUI(); }

// ─── NAVIGATION ───────────────────────────────────────────────────────────────

function selectPhase(id) { state.phase = id; state.screen = 'day'; render(); }
function selectDay(id) {
  state.dayId = id; state.exIdx = 0; state.setsMap = {}; state.weights = {};
  state.screen = 'workout'; render();
}
function goPhase()   { state.screen = 'phase';   render(); }
function goDay()     { state.screen = 'day';     render(); }
function goHistory() { state.screen = 'history'; render(); }
function anotherSession() { state.exIdx = 0; state.setsMap = {}; state.weights = {}; state.screen = 'day'; render(); }

function goPrevEx() {
  if (state.exIdx > 0) { stopTimerUI(); state.exIdx--; state.screen = 'workout'; render(); }
}

function goNextEx() {
  stopTimerUI();
  const exercises = getExercises();
  if (state.exIdx < exercises.length - 1) {
    state.exIdx++;
    state.screen = 'workout';
    render();
  } else {
    finishSession();
  }
}

function finishSession() {
  const ph = getPhase();
  const day = getDay();
  const exercises = getExercises();
  const session = {
    date: todayStr(),
    phase: state.phase,
    phaseName: ph?.name,
    day: state.dayId,
    dayName: day?.name,
    exercises: exercises.map((ex, i) => {
      const p = isVacation()
        ? { sets: ex.customSets, reps: ex.customReps }
        : { sets: PARAMS[state.phase]?.[ex.type]?.sets, reps: ex.customReps || PARAMS[state.phase]?.[ex.type]?.reps };
      return {
        name: ex.name,
        weight: state.weights[i] || null,
        sets: (state.setsMap[i] || []).filter(Boolean).length,
        reps: p.reps || '—',
      };
    })
  };
  state.history = [session, ...state.history].slice(0, 60);
  saveHistory();
  state.screen = 'done';
  render();
}

function clearHistory() {
  if (confirm('Clear all session history?')) {
    state.history = [];
    saveHistory();
    render();
  }
}

// ─── INIT ────────────────────────────────────────────────────────────────────

render();
</script>
</body>
</html>
