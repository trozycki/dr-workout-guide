<title>Metamorphosis</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body { height: 100%; background: #0a0a0a; color: #fff; font-family: 'Barlow', sans-serif; font-size: 16px; line-height: 1.5; overflow-x: hidden; }
  #app { min-height: 100vh; display: flex; flex-direction: column; }
  .h { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; }
  .muted { color: rgba(255,255,255,0.4); }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 6px; }
  .progress-bar { height: 3px; background: #1a1a1a; flex-shrink: 0; }
  .progress-fill { height: 3px; transition: width 0.3s ease; }
  .screen { min-height: 100vh; display: flex; flex-direction: column; }

  /* Home screen */
  .home-header { padding: 44px 24px 20px; }
  .home-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 40px; line-height: 1; color: #fff; }
  .home-header-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.35); padding: 0 24px; margin: 20px 0 10px; }
  .loc-grid { padding: 0 24px; display: grid; grid-template-columns: 1fr; gap: 10px; }
  .loc-card { background: #141414; border-radius: 18px; padding: 20px; display: flex; align-items: center; gap: 16px; cursor: pointer; border: 1px solid transparent; position: relative; overflow: hidden; }
  .loc-card:active { transform: scale(0.98); }
  .loc-card-bar { position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
  .loc-icon { font-size: 30px; width: 40px; text-align: center; flex-shrink: 0; }
  .loc-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 22px; color: #fff; }
  .loc-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }
  .loc-arrow { margin-left: auto; color: rgba(255,255,255,0.2); font-size: 20px; }

  .addon-row { padding: 0 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .addon-card { background: #141414; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; text-align: center; cursor: pointer; }
  .addon-card:active { transform: scale(0.97); }
  .addon-icon { font-size: 24px; margin-bottom: 6px; }
  .addon-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px; color: #fff; }
  .addon-sub { font-size: 10px; color: rgba(255,255,255,0.35); margin-top: 2px; }

  .home-footer { text-align: center; font-size: 11px; color: rgba(255,255,255,0.3); padding: 28px 24px; margin-top: auto; }
  .log-chip { background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.55); border-radius: 12px; padding: 8px 12px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Barlow', sans-serif; }

  .back-btn { background: none; border: none; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0; margin-bottom: 20px; display: block; font-family: 'Barlow', sans-serif; }

  /* Workout screen (shared with before) */
  .workout-header { padding: 14px 24px 10px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .workout-counter { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.4); }
  .workout-counter span { color: #fff; }
  .card-wrap { flex: 1; padding: 0 16px 12px; display: flex; flex-direction: column; overflow-y: auto; }
  .ex-card { background: #141414; border-radius: 20px; padding: 20px; flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; transition: border-color 0.3s; }
  .badge-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .badge-neutral { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.4); }
  .ex-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 30px; line-height: 1.05; margin-bottom: 8px; color: #fff; }
  .ex-tip { font-size: 13px; color: rgba(255,255,255,0.45); line-height: 1.55; margin-bottom: 16px; font-style: italic; }
  .stats-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .stat-box { background: #1e1e1e; border-radius: 14px; padding: 12px 8px; text-align: center; flex: 1; }
  .stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 22px; }
  .stat-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-top: 3px; }

  .weight-section { margin-bottom: 18px; }
  .weight-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .weight-label { font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.4); }
  .last-weight { font-size: 11px; color: rgba(255,255,255,0.28); }
  .weight-input-row { display: flex; align-items: center; gap: 10px; }
  .weight-input { flex: 1; background: #1e1e1e; border-radius: 14px; padding: 14px 16px; color: #fff; font-size: 24px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; outline: none; width: 100%; border: 1.5px solid rgba(255,255,255,0.1); }
  .weight-unit { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px; color: rgba(255,255,255,0.28); white-space: nowrap; }

  .sets-label { font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 10px; }
  .sets-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .set-circle { width: 54px; height: 54px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.14); background: transparent; color: rgba(255,255,255,0.28); font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 20px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
  .set-circle.done { color: #000; transform: scale(1.1); }
  .all-done-msg { font-size: 13px; font-weight: 600; margin-top: 14px; display: none; }

  .timer-overlay { position: absolute; inset: 0; background: rgba(10,10,10,0.97); border-radius: 20px; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
  .timer-overlay.visible { display: flex; }
  .timer-label { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 20px; }
  .timer-ring { position: relative; width: 140px; height: 140px; margin-bottom: 14px; }
  .timer-ring svg { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }
  .timer-number { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 52px; }
  .timer-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 6px; }
  .skip-btn { background: #1e1e1e; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.55); border-radius: 40px; padding: 12px 28px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Barlow', sans-serif; }

  .nav-row { padding: 0 16px 32px; display: flex; gap: 10px; flex-shrink: 0; }
  .nav-btn { flex: 1; padding: 18px; border: none; border-radius: 16px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.05em; cursor: pointer; }
  .nav-btn-prev { background: #1a1a1a; color: #fff; }
  .nav-btn-prev:disabled { color: rgba(255,255,255,0.18); }
  .nav-btn-next { background: #1a1a1a; color: #fff; }

  .done-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; }
  .done-check { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 72px; line-height: 1; margin-bottom: 16px; }
  .done-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 44px; line-height: 1; margin-bottom: 8px; }

// ─── STATE ───────────────────────────────────────────────────────────────────

const state = {

  location: null,
  workout: null,
  exIdx: 0,
  setsMap: {},
  weights: {},
  timerSec: null,
  timerMax: null,
  timerInterval: null,
  history: [],
  rotIndex: {},
  yogaDuration: null,
};

try {
  const saved = localStorage.getItem('wg_history');
  if (saved) state.history = JSON.parse(saved);
  const rot = localStorage.getItem('wg_rotation');
  if (rot) state.rotIndex = JSON.parse(rot);
} catch(e) {}

function saveHistory() {
  try { localStorage.setItem('wg_history', JSON.stringify(state.history)); } catch(e) {}
}
function saveRotation() {
  try { localStorage.setItem('wg_rotation', JSON.stringify(state.rotIndex)); } catch(e) {}
}

function getLocation() { return LOCATIONS.find(l => l.id === state.location); }

function nextRotIndex(key, length) {
  const cur = state.rotIndex[key] || 0;
  const next = (cur + 1) % length;
  state.rotIndex[key] = next;
  saveRotation();
  return cur; // use current before incrementing, so first pick is index 0
}

function pickWorkout(locationId) {
  const variations = WORKOUTS[locationId];
  const idx = nextRotIndex('loc_' + locationId, variations.length);
  return variations[idx];
}

function pickAbFinisher() {
  const idx = nextRotIndex('ab', AB_FINISHERS.length);
  return AB_FINISHERS[idx];
}

function getFullExerciseList() {
  if (!state.workout) return [];
  const mainEx = state.workout.exercises.map(e => ({ ...e, isFinisher: false }));
  const finisherEx = (state.abFinisher ? state.abFinisher.exercises : []).map(e => ({ ...e, isFinisher: true }));
  return [...mainEx, ...finisherEx];
}

function getExercise() { return getFullExerciseList()[state.exIdx]; }

function getCurrentSets() {
  const exr = getExercise();
  const sets = exr?.sets || 1;
  return state.setsMap[state.exIdx] || Array(sets).fill(false);
}

function getLastWeight(exName) {
  for (const s of state.history) {
    const m = s.exercises?.find(e => e.name === exName);
    if (m?.weight) return m.weight;
  }
  return null;
}

function todayStr() {
  return new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function stopTimer() {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
  state.timerSec = null; state.timerMax = null; state.timerEndAt = null; state.timerBellFired = false;
  saveActiveSession();
}

const CIRC = 2 * Math.PI * 52;

// ─── SESSION PERSISTENCE ──────────────────────────────────────────────────────
// iOS reclaims/reloads backgrounded tabs after longer breaks (e.g. a meal out),
// which wipes all in-memory JS — including a running rest timer. Persisting the
// active session lets us rehydrate on reload and catch up instantly, including
// firing the bell immediately if it expired while the page was gone.

function saveActiveSession() {
  if (state.screen !== 'workout' || !state.location || !state.workout) {
    try { localStorage.removeItem('wg_active_session'); } catch(e) {}
    return;
  }
  try {
    localStorage.setItem('wg_active_session', JSON.stringify({
      location: state.location,
      workoutId: state.workout.id,
      abFinisherId: state.abFinisher ? state.abFinisher.id : null,
      exIdx: state.exIdx,
      setsMap: state.setsMap,
      weights: state.weights,
      timerEndAt: state.timerEndAt || null,
      timerMax: state.timerMax || null,
      timerBellFired: state.timerBellFired || false,
      savedAt: Date.now(),
    }));
  } catch(e) {}
}

function restoreActiveSession() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('wg_active_session') || 'null'); } catch(e) {}
  if (!saved || !saved.location || !saved.workoutId) return false;
  // Don't resurrect a session from more than 6 hours ago — that's not a background reload, that's a new day
  if (saved.savedAt && (Date.now() - saved.savedAt) > 6 * 60 * 60 * 1000) {
    try { localStorage.removeItem('wg_active_session'); } catch(e) {}
    return false;
  }
  const workout = (WORKOUTS[saved.location] || []).find(w => w.id === saved.workoutId);
  if (!workout) return false;

  state.location = saved.location;
  state.workout = workout;
  state.abFinisher = AB_FINISHERS.find(a => a.id === saved.abFinisherId) || AB_FINISHERS[0];
  state.exIdx = saved.exIdx || 0;
  state.setsMap = saved.setsMap || {};
  state.weights = saved.weights || {};
  state.screen = 'workout';

  if (saved.timerEndAt) {
    state.timerEndAt = saved.timerEndAt;
    state.timerMax = saved.timerMax;
    state.timerBellFired = saved.timerBellFired || false;
    state._resumeTimerAfterRender = true;
  }
  return true;
}

function resumeTimerAfterRender() {
  if (!state.timerEndAt) return;
  const overlay = document.getElementById('timer-overlay');
  if (overlay) overlay.classList.add('visible');
  const nextEl = document.getElementById('timer-next-label');
  if (nextEl) nextEl.style.display = 'none'; // can't reliably know if this was a last-set timer after reload
  tickTimer(); // fires the bell immediately if it already expired while the page was gone
  if (state.timerEndAt && !state.timerInterval) {
    state.timerInterval = setInterval(tickTimer, 250);
  }
}

function getLastWorkoutInfo() {
  const last = state.history.find(s => s.type !== 'yoga');
  if (!last) return null;
  try {
    const lastDate = new Date(last.date);
    const today = new Date(todayStr());
    const diffDays = Math.round((today - lastDate) / 86400000);
    return { ...last, diffDays };
  } catch(e) {
    return { ...last, diffDays: null };
  }
}

  const last = state.history[0];
  return `
  <div class="done-screen">
    <div class="done-check h" style="color:${loc.accent}">✓</div>
    <div class="done-title h">SESSION<br>COMPLETE</div>
    <div class="done-sub">${state.workout.name} · ${loc.name}</div>
    <div class="done-date">${todayStr()}</div>
    ${last ? `
    <div class="session-summary">
      <div class="summary-title">Session Summary</div>
      ${last.exercises.map(ex => `
        <div class="summary-row">
          <span class="summary-ex">${ex.isFinisher ? '🔥 ' : ''}${ex.name}</span>
          <div class="summary-vals">
            ${ex.weight ? `<span class="summary-weight h" style="color:${loc.accent}">${ex.weight} lbs</span>` : '<span class="summary-reps">—</span>'}
            <span class="summary-reps">${ex.sets}×${ex.reps}</span>
          </div>
        </div>`).join('')}
    </div>` : ''}
    <button class="done-btn done-btn-primary" onclick="goHome()">Back to Home</button>
    <button class="done-btn done-btn-ghost" onclick="goHistory()">View Full Log</button>
  </div>`;
}

function renderHistory() {
  return `
  <div class="screen">
    <div class="history-header">
      <div>
        <button class="back-btn" style="color:rgba(255,255,255,0.4);margin-bottom:10px" onclick="goHome()">← Back</button>
        <div class="history-title h">SESSION LOG</div>
        <div class="history-count">${state.history.length} session${state.history.length !== 1 ? 's' : ''} saved</div>
      </div>
      ${state.history.length > 0 ? `<button class="clear-btn" onclick="clearHistory()">Clear All</button>` : ''}
    </div>
    <div class="history-list">
      ${state.history.length === 0
        ? '<div class="history-empty">No sessions yet.</div>'
        : state.history.map(s => {
            if (s.type === 'yoga') {
              return `
              <div class="history-item">
                <div class="history-item-header">
                  <div><span class="history-item-name">🧘 Yoga</span></div>
                  <span class="history-item-date">${s.date}</span>
                </div>
                <div class="history-yoga-note">${s.duration} min session</div>
              </div>`;
            }
            const a = LOCATIONS.find(l => l.id === s.location)?.accent || '#f97316';
            return `
            <div class="history-item">
              <div class="history-item-header">
                <div>
                  <span class="history-item-name">${s.workoutName || '—'}</span>
                  <span class="history-item-tag">${s.locationName || ''}</span>
                </div>
                <span class="history-item-date">${s.date}</span>
              </div>
              ${(s.exercises||[]).map(ex => `
                <div class="history-ex-row">
                  <span class="history-ex-name">${ex.isFinisher ? '🔥 ' : ''}${ex.name}</span>
                  <div class="history-ex-vals">
                    ${ex.weight ? `<span class="history-ex-weight h" style="color:${a}">${ex.weight} lbs</span>` : '<span class="history-ex-reps">—</span>'}
                    <span class="history-ex-reps">${ex.sets}×${ex.reps}</span>
                  </div>
                </div>`).join('')}
            </div>`;
          }).join('')}
    </div>
  </div>`;
}

// ─── INTERACTIONS ──────────────────────────────────────────────────────────────

function startWorkoutListeners() {
  const ws = document.getElementById('workout-screen');
  if (!ws) return;
  let tx = null;
  ws.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  ws.addEventListener('touchend', e => {
    if (tx === null) return;
    const dx = tx - e.changedTouches[0].clientX;
    tx = null;
    if (Math.abs(dx) > 55) { dx > 0 ? goNextEx() : goPrevEx(); }
  }, { passive: true });
}

function onWeightInput(val) {
  state.weights[state.exIdx] = val;
  const input = document.getElementById('weight-input');
  const loc = getLocation();
  const exr = getExercise();
  const accent = exr.isFinisher ? '#ef4444' : loc.accent;
  if (input) input.style.borderColor = val ? accent + '60' : 'rgba(255,255,255,0.1)';
  saveActiveSession();
}

function tapSet(i) {
  const exr = getExercise();
  const sets = exr.sets || 1;
  const cur = state.setsMap[state.exIdx] || Array(sets).fill(false);
  const next = [...cur]; next[i] = !next[i];
  state.setsMap[state.exIdx] = next;

  const loc = getLocation();
  const accent = exr.isFinisher ? '#ef4444' : loc.accent;
  const btn = document.getElementById(`set-${i}`);
  if (btn) {
    btn.classList.toggle('done', next[i]);
    btn.style.background = next[i] ? accent : 'transparent';
    btn.style.borderColor = next[i] ? accent : 'rgba(255,255,255,0.14)';
    btn.style.color = next[i] ? '#000' : 'rgba(255,255,255,0.28)';
    btn.style.transform = next[i] ? 'scale(1.1)' : 'scale(1)';
    btn.textContent = next[i] ? '✓' : i + 1;
  }

  const allDone = next.every(Boolean);
  const msg = document.getElementById('all-done-msg');
  if (msg) msg.style.display = allDone ? 'block' : 'none';
  const card = document.getElementById('ex-card');
  if (card) card.style.borderColor = allDone ? accent + '55' : 'rgba(255,255,255,0.08)';
  const nextBtn = document.getElementById('btn-next');
  if (nextBtn) {
    nextBtn.style.background = allDone ? accent : '#1a1a1a';
    nextBtn.style.color = allDone ? '#000' : '#fff';
  }

  const isLastSet = i === sets - 1;
  if (next[i] && exr.restSec > 0) startTimer(exr.restSec, next[i] && isLastSet);
  else { stopTimerUI(); saveActiveSession(); }
}

// ─── AUDIO BELL ────────────────────────────────────────────────────────────
let audioCtx = null;
function unlockAudio() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
  } catch(e) {}
}

async function playBell() {
  try {
    if (!audioCtx || audioCtx.state === 'closed') {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }
    const now = audioCtx.currentTime;
    // Two-tone chime, smooth attack/decay so it never clicks or cuts out
    [ [880, 0], [1318.5, 0.16] ].forEach(([freq, delay]) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const t = now + delay;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.35, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      osc.start(t);
      osc.stop(t + 0.4);
    });
  } catch(e) {}
  try { if (navigator.vibrate) navigator.vibrate([180, 60, 180]); } catch(e) {}
}

function startTimer(seconds, showNext) {
  stopTimer();
  unlockAudio();
  state.timerMax = seconds;
  state.timerEndAt = Date.now() + seconds * 1000;
  state.timerBellFired = false;
  const overlay = document.getElementById('timer-overlay');
  if (overlay) overlay.classList.add('visible');
  const nextEl = document.getElementById('timer-next-label');
  if (nextEl) {
    if (showNext) {
      nextEl.textContent = state.nextLabel || '';
      nextEl.style.display = 'block';
    } else {
      nextEl.style.display = 'none';
    }
  }
  tickTimer();
  state.timerInterval = setInterval(tickTimer, 250);
  saveActiveSession();
}

function tickTimer() {
  if (!state.timerEndAt) return;
  const remainingMs = state.timerEndAt - Date.now();
  const remainingSec = Math.max(0, Math.ceil(remainingMs / 1000));
  state.timerSec = remainingSec;
  updateTimerUI();
  if (remainingMs <= 0 && !state.timerBellFired) {
    state.timerBellFired = true;
    playBell();
    stopTimerUI();
    stopTimer();
  }
}

function updateTimerUI() {
  const num = document.getElementById('timer-num');
  const arc = document.getElementById('timer-arc');
  if (num) num.textContent = state.timerSec;
  if (arc && state.timerMax) {
    const progress = state.timerSec / state.timerMax;
    arc.style.strokeDashoffset = CIRC - CIRC * Math.max(0, progress);
  }
}

function stopTimerUI() {
  const overlay = document.getElementById('timer-overlay');
  if (overlay) overlay.classList.remove('visible');
  stopTimer();
}
function skipRest() { stopTimerUI(); }

// Catch up instantly when the tab/app regains focus — re-sync the countdown
// and fire the bell immediately if it was missed while backgrounded.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    unlockAudio();
    if (state.timerEndAt) tickTimer();
  }
});
window.addEventListener('pageshow', () => {
  unlockAudio();
  if (state.timerEndAt) tickTimer();
});
window.addEventListener('focus', () => {
  unlockAudio();
  if (state.timerEndAt) tickTimer();
});


// ─── NAVIGATION ───────────────────────────────────────────────────────────────

function goHome() { state.screen = 'home'; render(); }
function goDay() { state.screen = 'day'; render(); }
function goHistory() { state.screen = 'history'; render(); }
function goYoga() { state.yogaDuration = null; state.screen = 'yoga'; render(); }
function goNutrition() { state.screen = 'nutrition'; render(); }
function goNutrSection(id) { state.screen = id; render(); }

function selectLocation(id) {
  state.location = id;
  state.screen = 'day';
  render();
}

function selectWorkout(workoutId) {
  const loc = getLocation();
  state.workout = WORKOUTS[state.location].find(w => w.id === workoutId);
  state.abFinisher = pickAbFinisher();
  state.exIdx = 0; state.setsMap = {}; state.weights = {};
  state.screen = 'workout';
  render();
}

function selectYogaDuration(d) { state.yogaDuration = d; render(); }

function logYoga() {
  if (!state.yogaDuration) return;
  state.history = [{ type: 'yoga', date: todayStr(), duration: state.yogaDuration }, ...state.history].slice(0, 80);
  saveHistory();
  goHome();
}

function goPrevEx() {
  if (state.exIdx > 0) { stopTimerUI(); state.exIdx--; state.screen = 'workout'; render(); }
}

function goNextEx() {
  stopTimerUI();
  const exercises = getFullExerciseList();
  if (state.exIdx < exercises.length - 1) {
    state.exIdx++;
    state.screen = 'workout';
    render();
  } else {
    finishSession();
  }
}

function finishSession() {
  const loc = getLocation();
  const exercises = getFullExerciseList();
  const session = {
    type: 'workout',
    date: todayStr(),
    location: state.location,
    locationName: loc.name,
    workoutName: state.workout.name,
    exercises: exercises.map((ex, i) => ({
      name: ex.name,
      isFinisher: ex.isFinisher,
      weight: state.weights[i] || null,
      sets: (state.setsMap[i] || []).filter(Boolean).length,
      reps: ex.reps || '—',
    }))
  };
  state.history = [session, ...state.history].slice(0, 80);
  saveHistory();
  try { localStorage.removeItem('wg_active_session'); } catch(e) {}
  state.screen = 'done';
  render();
}

function clearHistory() {
  if (confirm('Clear all session history?')) {
    state.history = [];
    saveHistory();
    render();
  }
}

const VAPID_PUBLIC_KEY = 'BNQmipke_FMscTfkYZX7uurh3o4e663X21dlEC3NTEhYIOTlQGm3QccyJ_XOnTpMgxY9WaP3EN2T6bwaJOdw75k';

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

function isStandalone() {
  return window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;
}

async function enablePushReminders() {
  const statusEl = document.getElementById('push-status');
  const btn = document.getElementById('push-enable-btn');
  const setStatus = (msg) => { if (statusEl) statusEl.textContent = msg; };

  if (!isStandalone()) {
    setStatus('Open this from your home-screen icon first (not a Safari tab), then try again.');
    return;
  }
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    setStatus("This device/browser doesn't support push notifications.");
    return;
  }

  try {
    setStatus('Requesting permission…');
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      setStatus('Permission denied — reminders stay off until allowed in Settings.');
      return;
    }

    const registration = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;

    let subscription = await registration.pushManager.getSubscription();
    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
    }

    const res = await fetch('/.netlify/functions/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(subscription),
    });

    if (res.ok) {
      setStatus('✓ Reminders enabled — you\'ll get pushes at each meal window.');
      if (btn) { btn.textContent = '🔔 Reminders Enabled'; btn.style.background = '#1a1a1a'; btn.style.color = '#22c55e'; btn.style.border = '1px solid #22c55e'; }
    } else {
      setStatus('Subscribed, but saving failed — try again in a minute.');
    }
  } catch (e) {
    setStatus('Something went wrong: ' + (e.message || e));
  }
}

async function checkPushStatus() {
  const btn = document.getElementById('push-enable-btn');
  const statusEl = document.getElementById('push-status');
  if (!btn) return;
  if (!isStandalone()) {
    if (statusEl) statusEl.textContent = 'Open from your home-screen icon to enable reminders.';
    return;
  }
  if (!('serviceWorker' in navigator)) return;
  try {
    const registration = await navigator.serviceWorker.getRegistration();
    if (registration) {
      const subscription = await registration.pushManager.getSubscription();
      if (subscription) {
        btn.textContent = '🔔 Reminders Enabled';
        btn.style.background = '#1a1a1a';
        btn.style.color = '#22c55e';
        btn.style.border = '1px solid #22c55e';
      }
    }
  } catch (e) {}
}

// Register service worker on load if running as installed app
if (isStandalone() && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

// ─── INIT ────────────────────────────────────────────────────────────────────

const _restored = restoreActiveSession();
render();
if (_restored && state._resumeTimerAfterRender) {
  state._resumeTimerAfterRender = false;
  resumeTimerAfterRender();
}
